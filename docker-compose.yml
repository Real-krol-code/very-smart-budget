name: finance-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [finance-net]

  same-bank:
    build:
      context: ./same-bank
      dockerfile: Dockerfile
    container_name: finance-app-same-bank
    restart: unless-stopped
    environment:
      SAME_BANK_SERVICE_TOKEN: ${SAME_BANK_SERVICE_TOKEN:?set SAME_BANK_SERVICE_TOKEN in .env}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${SAME_BANK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [finance-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-app-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SAME_BANK_BASE_URL: http://same-bank:8081
      SAME_BANK_SERVICE_TOKEN: ${SAME_BANK_SERVICE_TOKEN}
      SYNC_CRON: ${SYNC_CRON:-0 0 * * * *}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      same-bank:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks: [finance-net]

  swagger:
    build: ./api-contract
    container_name: finance-app-swagger
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8090}:80"
    networks: [finance-net]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: finance-app-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [finance-net]

volumes:
  postgres_data:
  pgadmin_data:

networks:
  finance-net:
    driver: bridge
