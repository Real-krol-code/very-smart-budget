          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/transactions/{transactionId}/category":
    put:
      operationId: "changeTransactionCategory"
      summary: "Назначить категорию операции"
      parameters: [{"name":"transactionId","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Идентификатор ресурса."}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["categoryId","version"]
              properties:
                categoryId:
                  type: "string"
                  minLength: 1
                  maxLength: 128
                version:
                  type: "integer"
                  format: "int64"
                  minimum: 1
              additionalProperties: false
            example: {"categoryId":"food","version":1}
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["transaction","affectedCategories"]
                properties:
                  transaction:
                    "$ref": "#/components/schemas/Transaction"
                  affectedCategories:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/CategoryUsage"
                additionalProperties: false
              example: {"transaction":{"id":"tx-1","occurredAt":"2026-11-16T12:00:00+04:00","amountMinor":22500,"currency":"RUB","direction":"DEBIT","description":"Покупка","category":{"id":"food","name":"Продукты"},"version":2},"affectedCategories":[{"categoryId":"food","spentMinor":22500,"limitMinor":10000000,"remainingMinor":9977500,"usedBasisPoints":22}]}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "404":
          description: "Объект или пользователь недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"NOT_FOUND","message":"Объект или пользователь недоступен"}
        "409":
          description: "Конфликт состояния или повторное использование ключа с другим содержимым"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"CONFLICT","message":"Конфликт состояния или повторное использование ключа с другим содержимым"}
        "422":
          description: "Нарушено бизнес-правило"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"VALIDATION_FAILED","message":"Нарушено бизнес-правило"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
