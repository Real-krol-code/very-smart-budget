openapi: "3.1.0"
info:
  title: "API приложения личного бюджета"
  version: "1.0.0"
  description: "Доступ к пользовательским данным и команды UC-01–UC-16. Успешные GET можно повторять. Команды создания бюджета, цели и пополнения повторяются с исходным ключом идемпотентности и тем же телом. После неопределённого исхода команды с версией перечитайте ресурс перед новым редактированием."
security: [{"UserToken":[]}]
paths:
  "/v1/auth/login":
    post:
      operationId: "login"
      summary: "Войти"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["login","password"]
              properties:
                login:
                  type: "string"
                  minLength: 1
                password:
                  type: "string"
                  minLength: 1
                  format: "password"
                  writeOnly: true
              additionalProperties: false
            example: {"login":"demo","password":"example-password"}
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["accessToken","tokenType","expiresInSeconds"]
                properties:
                  accessToken:
                    type: "string"
                  tokenType:
                    type: "string"
                    enum: ["Bearer"]
                  expiresInSeconds:
                    type: "integer"
                    format: "int64"
                    minimum: 1
                additionalProperties: false
              example: {"accessToken":"example-token","tokenType":"Bearer","expiresInSeconds":900}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "429":
          description: "Достигнут лимит запросов"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"RATE_LIMITED","message":"Достигнут лимит запросов"}
          headers:
            Retry-After:
              description: "Минимальная задержка перед повтором в секундах."
              schema:
                type: "integer"
                format: "int64"
                minimum: 0
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/budgets":
    post:
      operationId: "createBudget"
      summary: "Создать бюджет"
      parameters: [{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Ключ повторной отправки того же запроса."}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BudgetCreate"
            example: {"month":"2026-11","plannedIncomeMinor":10000000,"allocations":[{"categoryId":"food","shareBasisPoints":10000}]}
      responses:
        "201":
          description: "Создано"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Budget"
              example: {"id":"budget-1","month":"2026-11","version":1,"currency":"RUB","plannedIncomeMinor":10000000,"allocations":[{"categoryId":"food","shareBasisPoints":10000,"limitMinor":10000000}]}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "409":
          description: "Конфликт состояния или повторное использование ключа с другим содержимым"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"CONFLICT","message":"Конфликт состояния или повторное использование ключа с другим содержимым"}
        "422":
          description: "Нарушено бизнес-правило"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"VALIDATION_FAILED","message":"Нарушено бизнес-правило"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/budgets/{budgetId}":
    get:
      operationId: "getBudget"
      summary: "Получить бюджет"
      parameters: [{"name":"budgetId","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Идентификатор ресурса."}]
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Budget"
              example: {"id":"budget-1","month":"2026-11","version":1,"currency":"RUB","plannedIncomeMinor":10000000,"allocations":[{"categoryId":"food","shareBasisPoints":10000,"limitMinor":10000000}]}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "404":
          description: "Объект или пользователь недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"NOT_FOUND","message":"Объект или пользователь недоступен"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
    put:
      operationId: "updateBudget"
      summary: "Заменить параметры текущего бюджета"
      parameters: [{"name":"budgetId","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Идентификатор ресурса."}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/BudgetUpdate"
            example: {"version":1,"plannedIncomeMinor":10000000,"allocations":[{"categoryId":"food","shareBasisPoints":10000}]}
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Budget"
              example: {"id":"budget-1","month":"2026-11","version":2,"currency":"RUB","plannedIncomeMinor":10000000,"allocations":[{"categoryId":"food","shareBasisPoints":10000,"limitMinor":10000000}]}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "404":
          description: "Объект или пользователь недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"NOT_FOUND","message":"Объект или пользователь недоступен"}
        "409":
          description: "Конфликт состояния или повторное использование ключа с другим содержимым"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"CONFLICT","message":"Конфликт состояния или повторное использование ключа с другим содержимым"}
        "422":
          description: "Нарушено бизнес-правило"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"VALIDATION_FAILED","message":"Нарушено бизнес-правило"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/dashboard":
    get:
      operationId: "getDashboard"
      summary: "Открыть дашборд"
      parameters: [{"name":"month","in":"query","required":false,"schema":{"type":"string","pattern":"^[0-9]{4}-(0[1-9]|1[0-2])$"},"description":"Месяц. По умолчанию текущий в часовом поясе приложения."}]
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Dashboard"
              example: {"month":"2026-11","currency":"RUB","budget":{"id":"budget-1","month":"2026-11","version":1,"currency":"RUB","plannedIncomeMinor":10000000,"allocations":[{"categoryId":"food","shareBasisPoints":10000,"limitMinor":10000000}]},"totalSpentMinor":22500,"uncategorizedSpentMinor":0,"categories":[{"categoryId":"food","spentMinor":22500,"limitMinor":10000000,"remainingMinor":9977500,"usedBasisPoints":22}],"topExpenses":[{"id":"tx-1","occurredAt":"2026-11-16T12:00:00+04:00","amountMinor":22500,"currency":"RUB","direction":"DEBIT","description":"Покупка","category":{"id":"food","name":"Продукты"},"version":2}]}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
