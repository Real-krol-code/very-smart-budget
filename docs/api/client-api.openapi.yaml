components:
  securitySchemes:
    UserToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    Error:
      type: "object"
      required: ["code","message"]
      properties:
        code:
          type: "string"
        message:
          type: "string"
        details:
          type: "array"
          items:
            type: "object"
            required: ["field","reason"]
            properties:
              field:
                type: "string"
              reason:
                type: "string"
            additionalProperties: false
      additionalProperties: false
    Category:
      type: "object"
      required: ["id","name"]
      properties:
        id:
          type: "string"
          minLength: 1
          maxLength: 128
        name:
          type: "string"
          minLength: 1
      additionalProperties: false
    Allocation:
      type: "object"
      required: ["categoryId","shareBasisPoints"]
      properties:
        categoryId:
          type: "string"
          minLength: 1
          maxLength: 128
        shareBasisPoints:
          type: "integer"
          format: "int64"
          minimum: 0
          maximum: 10000
      additionalProperties: false
    BudgetCreate:
      type: "object"
      required: ["month","plannedIncomeMinor","allocations"]
      properties:
        month:
          type: "string"
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        plannedIncomeMinor:
          type: "integer"
          format: "int64"
          minimum: 1
        allocations:
          type: "array"
          items:
            "$ref": "#/components/schemas/Allocation"
          minItems: 1
      additionalProperties: false
    BudgetUpdate:
      type: "object"
      required: ["version","plannedIncomeMinor","allocations"]
      properties:
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        plannedIncomeMinor:
          type: "integer"
          format: "int64"
          minimum: 1
        allocations:
          type: "array"
          items:
            "$ref": "#/components/schemas/Allocation"
          minItems: 1
      additionalProperties: false
    Budget:
      type: "object"
      required: ["id","month","version","currency","plannedIncomeMinor","allocations"]
      properties:
        id:
          type: "string"
          minLength: 1
          maxLength: 128
        month:
          type: "string"
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        currency:
          type: "string"
          enum: ["RUB"]
        plannedIncomeMinor:
          type: "integer"
          format: "int64"
          minimum: 1
        allocations:
          type: "array"
          items:
            type: "object"
            required: ["categoryId","shareBasisPoints","limitMinor"]
            properties:
              categoryId:
                type: "string"
                minLength: 1
                maxLength: 128
              shareBasisPoints:
                type: "integer"
                format: "int64"
                minimum: 0
                maximum: 10000
              limitMinor:
                type: "integer"
                format: "int64"
                minimum: 0
            additionalProperties: false
      additionalProperties: false
    CategoryUsage:
      type: "object"
      required: ["categoryId","spentMinor","limitMinor","remainingMinor","usedBasisPoints"]
      properties:
        categoryId:
          type: "string"
          minLength: 1
          maxLength: 128
        spentMinor:
          type: "integer"
          format: "int64"
          minimum: 0
        limitMinor:
          type: "integer"
          format: "int64"
          minimum: 0
        remainingMinor:
          type: "integer"
          format: "int64"
        usedBasisPoints:
          anyOf: [{"type":"integer","format":"int64","minimum":0},{"type":"null"}]
      additionalProperties: false
    Dashboard:
      type: "object"
      required: ["month","currency","budget","totalSpentMinor","uncategorizedSpentMinor","categories","topExpenses"]
      properties:
        month:
          type: "string"
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        currency:
          type: "string"
          enum: ["RUB"]
        budget:
          anyOf: [{"$ref":"#/components/schemas/Budget"},{"type":"null"}]
        totalSpentMinor:
          type: "integer"
          format: "int64"
          minimum: 0
        uncategorizedSpentMinor:
          type: "integer"
          format: "int64"
          minimum: 0
        categories:
          type: "array"
          items:
            "$ref": "#/components/schemas/CategoryUsage"
        topExpenses:
          type: "array"
          items:
            "$ref": "#/components/schemas/Transaction"
      additionalProperties: false
    Transaction:
      type: "object"
      required: ["id","occurredAt","amountMinor","currency","direction","description","category","version"]
      properties:
        id:
          type: "string"
