            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/goals":
    get:
      operationId: "listGoals"
      summary: "Получить цели"
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Goal"
              example: [{"id":"goal-1","name":"Отпуск","currency":"RUB","targetMinor":600000,"savedMinor":0,"remainingMinor":600000,"progressBasisPoints":0,"deadline":"2027-05-16","remainingMonths":6,"recommendedMonthlyMinor":100000,"status":"ACTIVE"}]
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
    post:
      operationId: "createGoal"
      summary: "Создать цель"
      parameters: [{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Ключ повторной отправки того же запроса."}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
