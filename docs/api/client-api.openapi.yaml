          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/categories":
    get:
      operationId: "listCategories"
      summary: "Получить доступные категории расходов"
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Category"
              example: [{"id":"food","name":"Продукты"}]
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/transactions":
    get:
      operationId: "listTransactions"
      summary: "Получить операции за месяц"
      parameters: [{"name":"month","in":"query","required":false,"schema":{"type":"string","pattern":"^[0-9]{4}-(0[1-9]|1[0-2])$"},"description":"Месяц. По умолчанию текущий в часовом поясе приложения."},{"name":"cursor","in":"query","required":false,"schema":{"type":"string","minLength":1},"description":"Непрозрачный курсор. Сохраняйте фильтры первого запроса."},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","format":"int64","minimum":1,"maximum":100,"default":50},"description":"Максимальное число записей."}]
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TransactionPage"
              example: {"items":[{"id":"tx-1","occurredAt":"2026-11-16T12:00:00+04:00","amountMinor":22500,"currency":"RUB","direction":"DEBIT","description":"Покупка","category":null,"version":1}],"nextCursor":null}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
          description: "Недействительные учётные данные или токен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"UNAUTHORIZED","message":"Недействительные учётные данные или токен"}
        "404":
          description: "Объект или пользователь недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"NOT_FOUND","message":"Объект или пользователь недоступен"}
        "410":
          description: "Срок действия курсора истёк"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"CURSOR_EXPIRED","message":"Срок действия курсора истёк"}
        "500":
          description: "Внутренняя ошибка"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INTERNAL_ERROR","message":"Внутренняя ошибка"}
        "503":
          description: "Сервис временно недоступен"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен"}
  "/v1/transactions/{transactionId}":
    get:
      operationId: "getTransaction"
      summary: "Получить операцию"
      parameters: [{"name":"transactionId","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":128},"description":"Идентификатор ресурса."}]
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Transaction"
              example: {"id":"tx-1","occurredAt":"2026-11-16T12:00:00+04:00","amountMinor":22500,"currency":"RUB","direction":"DEBIT","description":"Покупка","category":null,"version":1}
        "400":
          description: "Некорректный запрос"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example: {"code":"INVALID_REQUEST","message":"Некорректный запрос"}
        "401":
