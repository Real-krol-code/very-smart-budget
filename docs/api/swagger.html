      description: \"Для известного пользователя пустой набор возвращается с items: [] и nextCursor: null. При неверной комбинации курсора и фильтров возвращается 400.\"\n      parameters: [{\"name\":\"externalUserId\",\"in\":\"path\",\"required\":true,\"schema\":{\"type\":\"string\",\"minLength\":1,\"maxLength\":128},\"description\":\"Идентификатор ресурса.\"},{\"name\":\"month\",\"in\":\"query\",\"required\":true,\"schema\":{\"type\":\"string\",\"pattern\":\"^[0-9]{4}-(0[1-9]|1[0-2])$\"},\"description\":\"Обязательный месяц загрузки.\"},{\"name\":\"cursor\",\"in\":\"query\",\"required\":false,\"schema\":{\"type\":\"string\",\"minLength\":1},\"description\":\"Непрозрачный курсор. Сохраняйте фильтры первого запроса.\"},{\"name\":\"limit\",\"in\":\"query\",\"required\":false,\"schema\":{\"type\":\"integer\",\"format\":\"int64\",\"minimum\":1,\"maximum\":100,\"default\":50},\"description\":\"Максимальное число записей.\"}]\n      responses:\n        \"200\":\n          description: \"Успешно\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/BankPage\"\n              example: {\"items\":[{\"externalTransactionId\":\"bank-tx-1\",\"occurredAt\":\"2026-11-16T12:00:00+04:00\",\"amountMinor\":22500,\"currency\":\"RUB\",\"direction\":\"DEBIT\",\"description\":\"Покупка\",\"mcc\":\"5411\",\"merchant\":\"Супермаркет\"}],\"nextCursor\":null}\n        \"400\":\n          description: \"Некорректный запрос\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"INVALID_REQUEST\",\"message\":\"Некорректный запрос\"}\n        \"401\":\n          description: \"Недействительные учётные данные или токен\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"UNAUTHORIZED\",\"message\":\"Недействительные учётные данные или токен\"}\n        \"403\":\n          description: \"Недостаточные права сервисного токена\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"FORBIDDEN\",\"message\":\"Недостаточные права сервисного токена\"}\n        \"404\":\n          description: \"Объект или пользователь недоступен\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"NOT_FOUND\",\"message\":\"Объект или пользователь недоступен\"}\n        \"410\":\n          description: \"Срок действия курсора истёк\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"CURSOR_EXPIRED\",\"message\":\"Срок действия курсора истёк\"}\n        \"429\":\n          description: \"Достигнут лимит запросов\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"RATE_LIMITED\",\"message\":\"Достигнут лимит запросов\"}\n          headers:\n            Retry-After:\n              description: \"Минимальная задержка перед повтором в секундах.\"\n              schema:\n                type: \"integer\"\n                format: \"int64\"\n                minimum: 0\n        \"500\":\n          description: \"Внутренняя ошибка\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"INTERNAL_ERROR\",\"message\":\"Внутренняя ошибка\"}\n        \"503\":\n          description: \"Сервис временно недоступен\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"SERVICE_UNAVAILABLE\",\"message\":\"Сервис временно недоступен\"}\ncomponents:\n  securitySchemes:\n    BankToken:\n      type: \"http\"\n      scheme: \"bearer\"\n  schemas:\n    Error:\n      type: \"object\"\n      required: [\"code\",\"message\"]\n      properties:\n        code:\n          type: \"string\"\n        message:\n          type: \"string\"\n        details:\n          type: \"array\"\n          items:\n            type: \"object\"\n            required: [\"field\",\"reason\"]\n            properties:\n              field:\n                type: \"string\"\n              reason:\n                type: \"string\"\n            additionalProperties: false\n      additionalProperties: false\n    BankOperation:\n      type: \"object\"\n      required: [\"externalTransactionId\",\"occurredAt\",\"amountMinor\",\"currency\",\"direction\",\"description\"]\n      properties:\n        externalTransactionId:\n          type: \"string\"\n          minLength: 1\n          maxLength: 128\n        occurredAt:\n          type: \"string\"\n          format: \"date-time\"\n        amountMinor:\n          type: \"integer\"\n          format: \"int64\"\n          minimum: 1\n        currency:\n          type: \"string\"\n          enum: [\"RUB\"]\n        direction:\n          type: \"string\"\n          enum: [\"DEBIT\",\"CREDIT\"]\n        description:\n          type: \"string\"\n        mcc:\n          type: \"string\"\n          pattern: \"^[0-9]{4}$\"\n        merchant:\n          type: \"string\"\n      additionalProperties: false\n    BankPage:\n      type: \"object\"\n      required: [\"items\",\"nextCursor\"]\n      properties:\n        items:\n          type: \"array\"\n          items:\n            \"$ref\": \"#/components/schemas/BankOperation\"\n        nextCursor:\n          anyOf: [{\"type\":\"string\",\"minLength\":1},{\"type\":\"null\"}]\n      additionalProperties: false\n"},{"name":"Same Notification Service","yaml":"openapi: \"3.1.0\"\ninfo:\n  title: \"Same Notification Service\"\n  version: \"1.0.0\"\n  description: \"Приём уведомлений для push-доставки. Получатель определяется по внешнему идентификатору в согласованном справочнике. Повтор с тем же ID и телом возвращает исходное подтверждение. Другие данные для того же ID возвращают 409. Ключ хранится как минимум 24 часа с первого приёма. Ответ 202 подтверждает постановку в очередь. Доставка на устройство и её статус находятся за пределами этого интерфейса.\"\nsecurity: [{\"NotificationToken\":[]}]\npaths:\n  \"/v1/push-notifications\":\n    post:\n      operationId: \"submitPush\"\n      summary: \"Поставить push в очередь\"\n      description: \"Idempotency-Key должен совпадать с notificationId. При сетевом сбое, 429 или 5xx допускаются два повтора с тем же ключом в пределах 24 часов. При остальных 4xx повторы прекращаются.\"\n      parameters: [{\"name\":\"Idempotency-Key\",\"in\":\"header\",\"required\":true,\"schema\":{\"type\":\"string\",\"minLength\":1,\"maxLength\":128},\"description\":\"Ключ повторной отправки того же запроса.\"}]\n      requestBody:\n        required: true\n        content:\n          \"application/json\":\n            schema:\n              \"$ref\": \"#/components/schemas/PushRequest\"\n            example: {\"notificationId\":\"n-1\",\"recipientId\":\"recipient-1\",\"type\":\"LIMIT_80\",\"text\":\"Израсходовано 80% лимита по категории «Продукты»\"}\n      responses:\n        \"202\":\n          description: \"Принято к обработке\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/PushAccepted\"\n              example: {\"notificationId\":\"n-1\",\"deliveryRequestId\":\"delivery-1\",\"status\":\"ACCEPTED\"}\n        \"400\":\n          description: \"Некорректный запрос\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"INVALID_REQUEST\",\"message\":\"Некорректный запрос\"}\n        \"401\":\n          description: \"Недействительные учётные данные или токен\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"UNAUTHORIZED\",\"message\":\"Недействительные учётные данные или токен\"}\n        \"403\":\n          description: \"Недостаточные права сервисного токена\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"FORBIDDEN\",\"message\":\"Недостаточные права сервисного токена\"}\n        \"404\":\n          description: \"Объект или пользователь недоступен\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"NOT_FOUND\",\"message\":\"Объект или пользователь недоступен\"}\n        \"409\":\n          description: \"Конфликт состояния или повторное использование ключа с другим содержимым\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"CONFLICT\",\"message\":\"Конфликт состояния или повторное использование ключа с другим содержимым\"}\n        \"429\":\n          description: \"Достигнут лимит запросов\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"RATE_LIMITED\",\"message\":\"Достигнут лимит запросов\"}\n          headers:\n            Retry-After:\n              description: \"Минимальная задержка перед повтором в секундах.\"\n              schema:\n                type: \"integer\"\n                format: \"int64\"\n                minimum: 0\n        \"500\":\n          description: \"Внутренняя ошибка\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"INTERNAL_ERROR\",\"message\":\"Внутренняя ошибка\"}\n        \"503\":\n          description: \"Сервис временно недоступен\"\n          content:\n            \"application/json\":\n              schema:\n                \"$ref\": \"#/components/schemas/Error\"\n              example: {\"code\":\"SERVICE_UNAVAILABLE\",\"message\":\"Сервис временно недоступен\"}\ncomponents:\n  securitySchemes:\n    NotificationToken:\n      type: \"http\"\n      scheme: \"bearer\"\n  schemas:\n    Error:\n      type: \"object\"\n      required: [\"code\",\"message\"]\n      properties:\n        code:\n          type: \"string\"\n        message:\n          type: \"string\"\n        details:\n          type: \"array\"\n          items:\n            type: \"object\"\n            required: [\"field\",\"reason\"]\n            properties:\n              field:\n                type: \"string\"\n              reason:\n                type: \"string\"\n            additionalProperties: false\n      additionalProperties: false\n    PushRequest:\n      type: \"object\"\n      required: [\"notificationId\",\"recipientId\",\"type\",\"text\"]\n      properties:\n        notificationId:\n          type: \"string\"\n          minLength: 1\n          maxLength: 128\n        recipientId:\n          type: \"string\"\n          minLength: 1\n          maxLength: 128\n        type:\n          type: \"string\"\n          enum: [\"LIMIT_80\",\"LIMIT_100\"]\n        text:\n          type: \"string\"\n          minLength: 1\n          maxLength: 500\n        objectUrl:\n          type: \"string\"\n          pattern: \"^/v1/\"\n      additionalProperties: false\n    PushAccepted:\n      type: \"object\"\n      required: [\"notificationId\",\"deliveryRequestId\",\"status\"]\n      properties:\n        notificationId:\n          type: \"string\"\n          minLength: 1\n          maxLength: 128\n        deliveryRequestId:\n          type: \"string\"\n          minLength: 1\n          maxLength: 128\n        status:\n          type: \"string\"\n          enum: [\"ACCEPTED\"]\n      additionalProperties: false\n"}]</script>
