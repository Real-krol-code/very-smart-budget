services:
  postgres:
    image: postgres:16
    container_name: smart-budget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_budget
      POSTGRES_USER: smart_budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - smart_budget_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_budget -d smart_budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.12.2
    profiles: ["migration"]
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  partition-maintainer:
    image: postgres:16
    container_name: smart-budget-partition-maintainer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: smart_budget
      PGDATABASE: smart_budget
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    entrypoint: [ "/bin/sh" ]
    command:
      - "-c"
      - |
        while true; do
          echo "Запуск обслуживания партиций"

          if psql -v ON_ERROR_STOP=1 -c "SELECT public.maintain_transaction_partitions();"; then
            echo "Обслуживание партиций завершено"
            sleep 86400
          else
            echo "Ошибка обслуживания партиций. Повторная попытка через 60 секунд"
            sleep 60
          fi
        done

volumes:
  smart_budget_postgres_data:
