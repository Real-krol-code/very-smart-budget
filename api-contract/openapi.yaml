openapi: 3.0.3
info:
  title: Finance App API
  description: Учёт бюджета и финансовые цели.
  version: 0.1.0
servers:
  - url: http://localhost:8080/api
    description: Local Backend (когда появится)
tags:
  - name: Categories
    description: Управление категориями (US-01, US-05)
  - name: Transactions
    description: Транзакции и классификация (US-02, US-03, US-04)
  - name: Goals
    description: Цели накопления (US-09, US-10)

paths:
  /categories:
    get:
      tags: [Categories]
      summary: Список категорий пользователя
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Создать категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /transactions:
    get:
      tags: [Transactions]
      summary: Просмотр транзакций за период (US-06)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
    post:
      tags: [Transactions]
      summary: Добавить транзакцию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /goals:
    post:
      tags: [Goals]
      summary: Создать цель накопления (US-09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
    get:
      tags: [Goals]
      summary: Список целей и прогресс (US-10)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Продукты"
        budgetLimit:
          type: number
          format: double
          example: 15000.00
          description: "Лимит на месяц"

    CreateCategoryRequest:
      type: object
      required: [name, budgetLimit]
      properties:
        name:
          type: string
          example: "Транспорт"
        budgetLimit:
          type: number
          format: double
          example: 5000.00

    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        amount:
          type: number
          format: double
          example: 450.50
        type:
          type: string
          enum: [INCOME, EXPENSE]
          example: "EXPENSE"
        categoryId:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date
          example: "2026-11-09"
        mcc:
          type: string
          example: "5411"
          description: "Код категории торговой точки"
        description:
          type: string
          example: "Пятёрочка"

    CreateTransactionRequest:
      type: object
      required: [amount, type, date, mcc]
      properties:
        amount:
          type: number
          format: double
          example: 450.50
        type:
          type: string
          enum: [INCOME, EXPENSE]
          example: "EXPENSE"
        date:
          type: string
          format: date
          example: "2026-11-09"
        mcc:
          type: string
          example: "5411"
          description: "Для автоклассификации (US-04)"
        description:
          type: string
          example: "Пятёрочка"

    Goal:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        name:
          type: string
          example: "Отпуск"
        targetAmount:
          type: number
          format: double
          example: 100000.00
        currentAmount:
          type: number
          format: double
          example: 15000.00
        deadline:
          type: string
          format: date
          example: "2027-06-01"
        recommendedMonthlyPayment:
          type: number
          format: double
          example: 8500.00
          description: "Рекомендуемый взнос (US-10)"

    CreateGoalRequest:
      type: object
      required: [name, targetAmount, deadline]
      properties:
        name:
          type: string
          example: "Новый ноутбук"
        targetAmount:
          type: number
          format: double
          example: 80000.00
        deadline:
          type: string
          format: date
          example: "2027-01-01"
